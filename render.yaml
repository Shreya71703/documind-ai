services:
  # FastAPI Backend API
  - type: web
    name: documind-backend
    runtime: python
    buildCommand: cd backend && pip install --prefer-binary -r requirements.txt
    startCommand: cd backend && sh start.sh
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: documind-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTO_DEPLOY_TRIGGER
        value: "v_deploy_force_sync_1"

  # React Frontend (Static Site)
  - type: web
    name: documind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://documind-backend-j6el.onrender.com

databases:
  - name: documind-db
    plan: free
    databaseName: rag_db
    user: rag_user
